<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioVasc - Acesso Vascular</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f4f5f7; /* Fundo off-white estilo PG */
            --card-bg: #ffffff;
            --dark-card: #18181b; /* Cartão escuro estilo "18 Mentorados" */
            --text-main: #18181b;
            --text-muted: #71717a;
            --btn-primary: #047857; /* Verde estilo botão "Novo mentorado" */
            --btn-hover: #065f46;
            --border: #e4e4e7;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Container simulando App Mobile */
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Header Minimalista */
        header {
            padding: 40px 24px 20px 24px;
            position: relative;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        header p {
            font-size: 0.85rem;
            margin: 0;
            color: var(--text-muted);
            font-weight: 500;
        }

        .back-btn {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .content {
            padding: 0 24px 24px 24px;
            flex: 1;
            overflow-y: auto;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Cartão Escuro de Boas-vindas (Estilo PG Mentoria) */
        .welcome-card {
            background-color: var(--dark-card);
            color: #ffffff;
            padding: 24px;
            border-radius: 20px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
        }

        .welcome-card h2 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f4f4f5;
        }
