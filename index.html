<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CardioVasc - Acesso Vascular</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f4f5f7; 
            --card-bg: #ffffff;
            --dark-card: #18181b; 
            --text-main: #18181b;
            --text-muted: #71717a;
            --btn-primary: #047857; 
            --btn-hover: #065f46;
            --danger: #dc2626;
            --water: #0ea5e9;
            --border: #e4e4e7;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 16px rgba(0, 0, 0, 0.06);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-main); margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        .app-container { width: 100%; max-width: 480px; background-color: var(--bg-body); height: 100vh; display: flex; flex-direction: column; position: relative; overflow: hidden; }

        /* Telas */
        .screen { display: none; height: 100%; flex-direction: column; animation: fadeIn 0.3s ease; overflow-y: auto; padding-bottom: 80px; }
        .screen.active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* TELA DE LOGIN */
        #screen-login { justify-content: center; align-items: center; padding: 24px; background: var(--card-bg); z-index: 100; }
        .login-logo { width: 80px; height: 80px; background: var(--dark-card); border-radius: 20px; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; font-weight: bold; }
        .login-btn { background: white; border: 1px solid var(--border); padding: 14px 24px; border-radius: 30px; font-size: 0.95rem; font-weight: 600; color: var(--text-main); cursor: pointer; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-sm); width: 100%; justify-content: center; margin-top: 30px; }
        .login-btn img { width: 24px; }

        /* HEADER COMUM */
        header { padding: 30px 24px 16px 24px; flex-shrink: 0; }
        header h1 { font-size: 1.4rem; font-weight: 700; margin: 0 0 4px 0; color: var(--text-main); }
        header p { font-size: 0.85rem; margin: 0; color: var(--text-muted); }

        .content-scroll { padding: 0 24px 24px 24px; flex: 1; }

        /* CARDS & COMPONENTES */
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
        .card-dark { background: var(--dark-card); color: white; }
        
        .section-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin: 24px 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px; }

        /* Botão SOS */
        .sos-btn { background: var(--danger); color: white; border: none; padding: 16px; border-radius: 16px; font-size: 1rem; font-weight: 700; width: 100%; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); margin-bottom: 20px; }
        
        /* Gamificação */
        .level-bar { width: 100%; background: #e4e4e7; height: 8px; border-radius: 4px; margin-top: 12px; overflow: hidden; }
        .level-fill { height: 100%; background: var(--btn-primary); width: 0%; transition: width 0.5s ease; }

        /* Frêmito & Água */
        .action-row { display: flex; gap: 10px; margin-top: 12px; }
        .btn-action { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-body); font-weight: 600; cursor: pointer; color: var(--text-main); }
        .btn-action.active { background: var(--btn-primary); color: white; border-color: var(--btn-primary); }
        
        .water-circle { width: 80px; height: 80px; border-radius: 50%; border: 4px solid var(--water); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; color: var(--water); margin: 0 auto 12px auto; }
        
        /* Formulários */
        .input-group { display: flex; gap: 12px; margin-bottom: 12px; }
        .input-box { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-body); outline: none; }
        .btn-submit { background: var(--btn-primary); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: 600; cursor: pointer; }
        
        .history-list { font-size: 0.85rem; margin-top: 16px; }
        .history-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
        
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
        .photo-box { width: 100%; aspect-ratio: 1; background: #e4e4e7; border-radius: 10px; background-size: cover; background-position: center; }

        /* Módulos de Ensino */
        .module-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; cursor: pointer; transition: transform 0.2s; }
        .module-card:active { transform: scale(0.98); }
        .module-info h3 { margin: 0 0 4px 0; font-size: 0.95rem; }
        .module-info p { margin: 0; font-size: 0.8rem; color: var(--text-muted); }
        .module-icon { width: 32px; height: 32px; background: var(--bg-body); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; }

        .back-sub-btn { background: white; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; margin-bottom: 16px; display: inline-flex; align-items: center; gap: 6px; }

        /* VÍDEOS */
        .video-wrapper { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 12px; aspect-ratio: 16/9; }
        .video-wrapper iframe { width: 100%; height: 100%; border: none; }
        .video-title { font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin: 0 0 20px 0; }

        /* NAVEGAÇÃO INFERIOR */
        .bottom-nav { position: absolute; bottom: 0; width: 100%; background: var(--card-bg); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 20px 0; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 0.7rem; font-weight: 600; cursor: pointer; }
        .nav-item.active { color: var(--btn-primary); }
        .nav-icon { font-size: 1.2rem; }

        /* CHATBOT */
        .chat-fab { position: absolute; bottom: 80px; right: 20px; width: 56px; height: 56px; background: var(--dark-card); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: var(--shadow-md); z-index: 20; }
        .chat-window { position: absolute; bottom: 140px; right: 20px; width: calc(100% - 40px); background: var(--card-bg); border-radius: 16px; box-shadow: var(--shadow-md); border: 1px solid var(--border); display: none; flex-direction: column; z-index: 20; overflow: hidden; }
        .chat-header { background: var(--dark-card); color: white; padding: 12px 16px; font-weight: 600; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .chat-body { height: 250px; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: var(--bg-body); }
        .msg { padding: 10px 14px; border-radius: 14px; font-size: 0.85rem; max-width: 85%; }
        .msg-bot { background: white; border: 1px solid var(--border); align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg-user { background: var(--btn-primary); color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .chat-input-area { display: flex; border-top: 1px solid var(--border); background: white; }
        .chat-input-area input { flex: 1; border: none; padding: 12px 16px; outline: none; font-size: 0.85rem; }
        .chat-input-area button { background: none; border: none; padding: 0 16px; color: var(--btn-primary); font-weight: bold; cursor: pointer; }

        /* MODAL SOS */
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50; display: none; justify-content: center; align-items: center; padding: 24px; }
        .sos-card { background: white; border-radius: 20px; padding: 24px; width: 100%; text-align: center; }
        .sos-card h2 { color: var(--danger); margin-top: 0; }
        .sos-steps { text-align: left; margin: 20px 0; font-size: 0.95rem; font-weight: 600; line-height: 1.6; }
